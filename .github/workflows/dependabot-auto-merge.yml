name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    # This workflow does not check out or run PR code. It only asks GitHub to
    # auto-merge Dependabot PRs once the repository's normal requirements pass.
    if: >
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # update-type lets us hold majors back for a human. Dependabot's own
      # metadata is the only trustworthy source here -- the PR title is
      # attacker-shaped input on pull_request_target.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      # Squash, not merge: the `master` ruleset requires linear history, and a
      # merge commit is rejected with "Merge commits are not allowed on this
      # repository" -- which failed this job on every PR it ever ran against.
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Explain why a major was left alone
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "::notice::Major update (${{ steps.metadata.outputs.dependency-names }}) left for manual review; auto-merge not enabled."
