name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    # This workflow does not check out or run PR code. It only asks GitHub to
    # auto-merge Dependabot PRs once the repository's normal requirements pass.
    if: >
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Every update, majors included, merges once the required checks pass: the
      # full test matrix, integration and package jobs are the gate, not a human.
      # A major that breaks them stays open with red checks.
      # Squash, not merge: the branch rulesets require linear history, and a
      # merge commit is rejected with "Merge commits are not allowed on this
      # repository" -- which failed this job on every PR it ever ran against.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
